# Gold-set v1: hand-labeled job descriptions for extractor evaluation.
# Labels record what a careful human reader would extract — they are the
# truth the extractor is measured against, never adjusted to match its
# output. Grow this file over time; ~30 docs now, target 100+.
#
# Fields: technologies maps slug -> requirement level (required|preferred|mentioned).
# canonical_title null means "a human couldn't map this to a family either".

documents:
  - id: gold-001
    title: "Senior Backend Engineer"
    text: |
      About the role
      We build the payments platform that processes millions of transactions daily.

      What you'll do
      • Design and ship APIs in Python using FastAPI
      • Own PostgreSQL schema design and query performance
      • Operate services in Docker on AWS

      Requirements
      • 5+ years of backend experience
      • Deep experience with Python and PostgreSQL
      • Comfort with Docker and CI/CD pipelines

      Nice to have
      • Redis caching experience
      • Terraform

      Benefits
      This is a hybrid role (3 days in office). Salary range: $170,000 - $210,000 per year.
    technologies:
      python: required
      fastapi: mentioned
      postgresql: required
      docker: required
      aws: mentioned
      redis: preferred
      terraform: preferred
    canonical_title: backend-engineer
    experience_level: senior
    years_of_experience: 5
    arrangement: hybrid
    salary_annual_min: 170000
    salary_annual_max: 210000

