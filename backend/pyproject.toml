[project]
name = "xcelsior-backend"
version = "0.1.0"
description = "Xcelsior API and data pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
    "pyahocorasick>=2.3.1",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "nh3>=0.2.18",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "import-linter>=2.13",
    "fpdf2>=2.8.7",
]

[project.scripts]
xcelsior = "app.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's dependency injection uses calls in argument defaults by design.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

# The dependency direction the architecture promises (§6): pipelines sit
# above the canonical catalog, entrypoints above everything, and the geo
# resolver + core stay leaf-like. Broken contracts fail CI.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.main | app.cli",
    "app.analytics | app.profile",
    "app.extraction | app.ingestion",
    "app.catalog",
    "app.accounts",
    "app.geo",
    "app.core",
]
# The job-detail endpoint reads Source for display policy + attribution.
# Catalog owning presentation of raw-layer provenance is accepted debt;
# revisit if a second exception appears.
ignore_imports = ["app.catalog.router -> app.ingestion.models"]
