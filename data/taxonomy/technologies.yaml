# Xcelsior technology taxonomy. Curated by hand; changes reviewed like code.
#
# Entry shape:
#   - name: Display Name          (also matched as an alias unless flags say otherwise)
#     slug: explicit-slug         (optional; derived from name when omitted)
#     category: one of languages | frameworks | cloud | infrastructure | databases |
#               testing | messaging | data_engineering | ai_ml | security
#     match:                      (optional; flags applied when matching the *name*)
#       case_sensitive: true      (must match exact case, e.g. Go, R, Ray)
#       require_context: true     (only counts near tech-context cues; for ambiguous words)
#     aliases:                    (optional; strings are safe defaults, dicts carry flags)
#       - simple-alias
#       - {alias: risky one, case_sensitive: true, require_context: true}

