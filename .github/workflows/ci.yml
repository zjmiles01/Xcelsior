name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xcelsior
          POSTGRES_PASSWORD: xcelsior
          POSTGRES_DB: xcelsior
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xcelsior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest
      # The committed OpenAPI schema must match the code that shipped it.
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build
      # Generated API types must match the committed OpenAPI schema.
      - run: npm run codegen
      - run: git diff --exit-code src/shared/api/schema.d.ts
